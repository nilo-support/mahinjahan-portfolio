<svg xmlns="http://www.w3.org/2000/svg" width="239.52" height="285.89" viewBox="188 360.09 239.52 285.89" fill="none"><!-- Split out of blank: the mascot group alone, in artboard units, with 5px above for the float. Positioned by the page (styles.css, .card__mascot) to the same place the artboard drew it, anchored to the card bottom. --><style>
/* Added by hand after the Figma export (site work, 2026-08-25). Figma has
   no way to express these, so re-exporting this node WILL drop them: the
   mascot's float and the screen's drift both live here.
   Declarative CSS only, because an SVG loaded as an image runs its own
   animations but never its scripts. */
.jbob   { animation: jbob 4.5s ease-in-out infinite alternate; }
.jdrift { animation: jdrift 9s ease-in-out infinite alternate; }
@keyframes jbob   { from { transform: translateY(0); }  to { transform: translateY(-5px); } }
@keyframes jdrift { from { transform: translateY(0); }  to { transform: translateY(-9px); } }
.jeye   { transform-box: fill-box; transform-origin: center; animation: jblink 5.4s ease-in-out infinite; }
.jlook  { transform-box: fill-box; transform-origin: center; animation: jlook 7s ease-in-out infinite alternate; }
.jglass { transform-box: fill-box; transform-origin: center; animation: jglass 3.8s ease-in-out infinite alternate; }
@keyframes jblink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.08); } 97% { transform: scaleY(1); } }
@keyframes jlook  { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
@keyframes jglass { from { transform: rotate(-3.5deg) translateY(0); } to { transform: rotate(3.5deg) translateY(-2px); } }
@media (prefers-reduced-motion: reduce) {
  .jbob, .jdrift, .jeye, .jlook, .jglass { animation: none; }
}
